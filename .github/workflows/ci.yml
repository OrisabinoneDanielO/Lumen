name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            qt_arch: linux_gcc_64
          - name: macOS
            os: macos-14
            qt_arch: clang_64
          - name: Windows
            os: windows-2022
            qt_arch: win64_msvc2022_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1-dev \
            libpulse0 libva2 libva-drm2 libva-x11-2 strace

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          cache: true
          modules: 'qtmultimedia qtpdf'

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

  # The Linux AppImage (batch 12), built on the oldest supported Ubuntu so it
  # runs on as many distributions as possible.
  appimage:
    name: AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1-dev \
            libpulse0 libva2 libva-drm2 libva-x11-2 libfuse2

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          cache: true
          modules: 'qtmultimedia qtpdf'

      - name: Build
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Get linuxdeploy
        run: |
          mkdir -p build/tools
          curl -sSL -o build/tools/linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSL -o build/tools/linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x build/tools/*.AppImage

      - name: Build the AppImage
        run: packaging/linux/build-appimage.sh

      - name: The AppImage starts and quits
        run: |
          app=$(ls build/appimage/Lumen-Presenter-*-x86_64.AppImage)
          QT_QPA_PLATFORM=offscreen "$app" --version
          QT_QPA_PLATFORM=offscreen "$app" --no-output --quit-after=3000

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Presenter-AppImage
          path: build/appimage/Lumen-Presenter-*-x86_64.AppImage
