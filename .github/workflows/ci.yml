name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            qt_arch: linux_gcc_64
          - name: macOS
            os: macos-15
            qt_arch: clang_64
          - name: Windows
            os: windows-2022
            qt_arch: win64_msvc2022_64

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1-dev \
            libpulse0 libva2 libva-drm2 libva-x11-2 strace libasound2-dev

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          cache: true
          modules: 'qtmultimedia qtpdf'

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      # macOS runners are virtual machines without a GPU, far slower than any
      # operator PC: speed checks (tests/support/timing.h) are skipped here and
      # run in the advisory step below. Linux and Windows run them strictly.
      - name: Test
        run: ctest --preset release
        env:
          LUMEN_SKIP_TIMING: ${{ runner.os == 'macOS' && '1' || '0' }}

      - name: Speed checks (advisory on macOS)
        if: runner.os == 'macOS' && !cancelled()
        continue-on-error: true
        run: ctest --preset release -L timing --output-on-failure

      # A test that crashes loses its buffered output (on Windows
      # especially); run the failed ones again writing to a file as they go.
      - name: Rerun failed tests with full output
        if: failure()
        shell: bash
        run: |
          cd build/release
          for t in $(ctest --show-only=json-v1 | python3 -c "import json,sys; print(' '.join(t['name'] for t in json.load(sys.stdin)['tests'] if t['name'].startswith('tst_')))"); do
            if grep -q "^$t\$" Testing/Temporary/LastTestsFailed.log 2>/dev/null || grep -q ":$t\$" Testing/Temporary/LastTestsFailed.log 2>/dev/null; then
              echo "::group::$t"
              rc=0; QT_QPA_FONTDIR="${WINDIR:-}/Fonts" QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software ./bin/$t -o $t.txt,txt -v1 || rc=$?; echo "exit code $rc"
              cat $t.txt || true
              echo "::endgroup::"
            fi
          done

  # Memory and undefined-behaviour errors: every test under AddressSanitizer
  # and UndefinedBehaviorSanitizer (debug build; leak reports off, Qt's
  # caches look like leaks).
  sanitizers:
    name: Linux (sanitizers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1-dev \
            libpulse0 libva2 libva-drm2 libva-x11-2 libasound2-dev
      - uses: lukka/get-cmake@latest
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          cache: true
          modules: 'qtmultimedia qtpdf'
      - name: Build
        run: |
          cmake --preset debug "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
          cmake --build --preset debug
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          LUMEN_SKIP_TIMING: '1'
        run: ctest --preset debug --output-on-failure

