# Installers for every system (packaging/README.md). Each job builds one,
# installs it on a clean machine or container, and runs
# `lumen --check-install` (window, Bibles, renderer, first output frame).
name: Packages

on:
  push:
    # Also branches named packaging/..., to build the installers before merging.
    branches: [main, 'packaging/**']
    tags: ['v*']
  pull_request:
    paths: ['packaging/**', '.github/workflows/packages.yml', 'CMakeLists.txt', 'app/CMakeLists.txt', 'render/CMakeLists.txt']
  workflow_dispatch:

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'

jobs:
  windows:
    name: Windows (.msi)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/get-cmake@latest
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
          modules: 'qtmultimedia qtpdf'

      - name: WiX Toolset 3
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue) -and -not $env:WIX) {
            choco install wixtoolset --version 3.14.1 -y --no-progress
          }
          $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' | Select-Object -First 1
          "WIX=$($wix.FullName)\" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build
        run: |
          cmake --preset release -DLUMEN_BUILD_TESTS=OFF
          cmake --build --preset release

      - name: Make the installer
        run: cpack --config build/release/CPackConfig.cmake -B build/packages -G WIX

      - name: Install, check and uninstall
        shell: pwsh
        run: |
          $msi = (Get-ChildItem build/packages/*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 50; exit 1 }
          $exe = "$env:ProgramFiles\Lumen Presenter\lumen.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem "$env:ProgramFiles\Lumen Presenter" -Recurse | Select-Object -First 40; exit 1 }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $c = Start-Process $exe -ArgumentList '--check-install' -Wait -PassThru -NoNewWindow -RedirectStandardOutput check.txt -RedirectStandardError check-err.txt
          Get-Content check.txt; Get-Content check-err.txt
          if ($c.ExitCode -ne 0) { exit 1 }
          $u = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($u.ExitCode -ne 0) { exit 1 }
          if (Test-Path $exe) { 'lumen.exe is still there after uninstalling'; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Presenter-Windows
          path: build/packages/*.msi

  macos:
    name: macOS (.dmg)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          cache: true
          modules: 'qtmultimedia qtpdf'

      - name: Build
        run: |
          cmake --preset release -DLUMEN_BUILD_TESTS=OFF
          cmake --build --preset release

      - name: Make the disk image
        run: cpack --config build/release/CPackConfig.cmake -B build/packages -G DragNDrop

      - name: Install and check
        run: |
          dmg=$(ls build/packages/*.dmg)
          hdiutil attach "$dmg" -mountpoint /Volumes/LumenCheck -nobrowse
          cp -R "/Volumes/LumenCheck/Lumen Presenter.app" "$RUNNER_TEMP/"
          ls /Volumes/LumenCheck
          hdiutil detach /Volumes/LumenCheck
          app="$RUNNER_TEMP/Lumen Presenter.app"
          codesign --verify --deep --strict "$app"
          QT_QPA_PLATFORM=offscreen "$app/Contents/MacOS/Lumen Presenter" --check-install

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Presenter-macOS
          path: build/packages/*.dmg

  deb:
    name: Debian (.deb)
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build g++ dpkg-dev file \
            qt6-base-dev qt6-base-private-dev qt6-declarative-dev qt6-multimedia-dev qt6-pdf-dev \
            libasound2-dev libgl-dev
      - name: Build
        run: |
          cmake --preset release -DLUMEN_BUILD_TESTS=OFF
          cmake --build --preset release
      - name: Make the package
        run: |
          cd build/release && cpack -G DEB -B ../packages
          dpkg-deb --info ../packages/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Presenter-deb
          path: build/packages/*.deb

  deb-check:
    name: Debian (.deb) on a clean system
    needs: deb
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Lumen-Presenter-deb
      - name: Install and check
        run: |
          apt-get update
          apt-get install -y ./lumen-presenter_*.deb
          QT_QPA_PLATFORM=offscreen lumen --check-install

  rpm:
    name: Fedora (.rpm)
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          dnf install -y cmake ninja-build gcc-c++ rpm-build file \
            qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel qt6-qtmultimedia-devel \
            qt6-qtpdf-devel alsa-lib-devel mesa-libGL-devel
      - name: Build
        run: |
          cmake --preset release -DLUMEN_BUILD_TESTS=OFF
          cmake --build --preset release
      - name: Make the package
        run: |
          cd build/release && cpack -G RPM -B ../packages
          rpm -qpR ../packages/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Presenter-rpm
          path: build/packages/*.rpm

  rpm-check:
    name: Fedora (.rpm) on a clean system
    needs: rpm
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Lumen-Presenter-rpm
      - name: Install and check
        run: |
          dnf install -y ./lumen-presenter-*.rpm
          QT_QPA_PLATFORM=offscreen lumen --check-install

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.8
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Lumen-Presenter.flatpak
          manifest-path: packaging/flatpak/io.github.OrisabinoneDanielO.Lumen.yml
          cache-key: flatpak-builder-${{ github.sha }}
