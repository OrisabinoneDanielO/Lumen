<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audience output</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;background:#000000}
</style>
</head>
<body>


<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #101C33; font-family: Inter, system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; left: -120px; top: -160px; width: 640px; height: 640px; border-radius: 320px; background: #24406E; filter: blur(120px); opacity: 0.7"></div>
  <div aria-hidden="true" style="position: absolute; right: -160px; bottom: -200px; width: 720px; height: 720px; border-radius: 360px; background: #3A2F5E; filter: blur(140px); opacity: 0.6"></div>
  <div style="position: absolute; left: 96px; right: 96px; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center">
    <p style="margin: 0; color: #FFFFFF; font-size: 52px; font-weight: 600; line-height: 1.35; text-align: center; text-shadow: 0 3px 14px rgba(0,0,0,0.6)">'Twas grace that taught my heart to fear,<br>And grace my fears relieved;</p>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 28px; text-align: center; color: #C9D3E6; font-size: 15px">Amazing Grace · John Newton · Public domain</div>
  <div style="position: absolute; right: 40px; top: 32px; color: #FFFFFF; opacity: 0.7; font-size: 14px; font-weight: 700; letter-spacing: 0.12em">[CHURCH LOGO]</div>
</div>


</body>
</html>
