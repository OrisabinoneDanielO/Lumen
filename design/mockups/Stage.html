<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stage display</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;background:#000000}
</style>
</head>
<body>


<div style="width: 1280px; height: 720px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; padding: 28px 36px; background: #000000; color: #FFFFFF; font-family: Inter, system-ui, sans-serif">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="padding: 6px 12px; border-radius: 6px; background: #1C3A37; color: #A6E6DC; font-size: 18px; font-weight: 700">VERSE 2</span>
      <span style="font-size: 18px; color: #A3ACBA">Amazing Grace · Key of G</span>
    </div>
    <div style="display: flex; align-items: center; gap: 32px">
      <div style="display: flex; flex-direction: column; align-items: flex-end">
        <span style="font-size: 13px; color: #A3ACBA; letter-spacing: 0.08em">SERVICE TIMER</span>
        <span style="font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; color: #F2C38B">[mm:ss]</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end">
        <span style="font-size: 13px; color: #A3ACBA; letter-spacing: 0.08em">TIME</span>
        <span style="font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums">[hh:mm]</span>
      </div>
    </div>
  </div>

  <div style="flex: 1 1 auto; display: flex; gap: 28px; min-height: 0">
    <div style="flex: 3 1 0px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.1em; color: #F08A24">NOW</span>
      <p style="margin: 0; font-size: 54px; font-weight: 700; line-height: 1.25">'Twas grace that taught my heart to fear,<br>And grace my fears relieved;</p>
    </div>
    <div style="flex: 2 1 0px; display: flex; flex-direction: column; gap: 10px; padding-left: 28px; border-left: 2px solid #2B303A">
      <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.1em; color: #8DB4FF">NEXT</span>
      <p style="margin: 0; font-size: 32px; font-weight: 600; line-height: 1.3; color: #C3CAD6">How precious did that grace appear<br>The hour I first believed.</p>
      <div style="flex: 1 1 auto"></div>
      <span style="font-size: 14px; letter-spacing: 0.08em; color: #A3ACBA">ARRANGEMENT</span>
      <span style="font-size: 22px; color: #C3CAD6">V1 · <span style="color: #FFFFFF; font-weight: 700">V2</span> · V3 · V4 · Tag</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-radius: 10px; background: #3A2A1E; color: #FFE3C4">
    <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.1em; color: #F2C38B">MESSAGE</span>
    <span style="font-size: 26px; font-weight: 600">Repeat the last verse</span>
  </div>
</div>


</body>
</html>
