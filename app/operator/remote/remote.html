<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1115">
<title>Lumen Remote</title>
<!-- The phone and tablet remote (batch 19). Served by Lumen on the local
     network; everything is in this file, so it needs no internet. -->
<style>
  :root { --bg: #0F1115; --panel: #171A20; --raised: #20242C; --border: #2B303A; --text: #F2F4F7;
          --muted: #A3ACBA; --live: #F08A24; --next: #5B8DEF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
               font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  header h1 { font-size: 15px; margin: 0; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .1em; }
  .live .label { color: var(--live); }
  .next .label { color: var(--next); }
  .text { white-space: pre-line; font-size: 20px; font-weight: 600; margin-top: 4px; min-height: 1.4em; }
  .next .text { font-size: 16px; color: #C3CAD6; font-weight: 500; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  button { flex: 1; border: 1px solid var(--border); background: var(--raised); color: var(--text);
           border-radius: 12px; padding: 14px 8px; font: inherit; font-weight: 600; touch-action: manipulation; }
  button:active { filter: brightness(1.3); }
  button.big { padding: 26px 8px; font-size: 20px; }
  button.primary { background: var(--live); border-color: var(--live); color: #1A1208; }
  button.on { background: var(--next); border-color: var(--next); }
  .tabs { display: flex; gap: 8px; margin: 14px 0 8px; }
  .tabs button { padding: 10px; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { text-align: left; padding: 12px 14px; font-weight: 500; white-space: pre-line; }
  .item small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .06em; }
  .item.current { border-color: var(--next); }
  .item.livenow { border-color: var(--live); }
  .header-item { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .1em; padding: 8px 4px 0; }
  #login { max-width: 420px; margin: 18vh auto 0; text-align: center; }
  #login input { width: 100%; font: 32px/1 system-ui, sans-serif; letter-spacing: .3em; text-align: center;
                 padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  #error { color: var(--live); min-height: 1.4em; margin: 10px 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="login">
  <h2>Lumen Remote</h2>
  <p>Enter the code shown in Lumen (Plan ▾ → Remote control).</p>
  <input id="code" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="Code">
  <div id="error" role="alert"></div>
  <button class="primary" id="connect">Connect</button>
</div>

<div id="remote" class="hidden">
  <header>
    <h1 id="plan">LUMEN</h1>
    <button id="logout" style="flex: 0; padding: 6px 10px; font-size: 13px">Code</button>
  </header>
  <div class="card live"><div class="label" id="liveLabel">LIVE</div><div class="text" id="live"></div></div>
  <div class="card next"><div class="label">NEXT</div><div class="text" id="next"></div></div>
  <div class="row">
    <button class="big" data-cmd="previous" aria-label="Previous slide">◀ Prev</button>
    <button class="big primary" data-cmd="next" aria-label="Next slide">Next ▶</button>
  </div>
  <div class="row">
    <button data-cmd="previousItem">◀ Item</button>
    <button data-cmd="nextItem">Item ▶</button>
  </div>
  <div class="row">
    <button data-cmd="clear" data-layer="slide">Clear slide</button>
    <button data-cmd="clearAll">Clear all</button>
    <button data-cmd="logo" id="logo">Logo</button>
    <button data-cmd="black" id="black">Black</button>
  </div>
  <div class="tabs">
    <button id="tabSlides" class="on">Slides</button>
    <button id="tabPlan">Plan</button>
  </div>
  <div id="slides" class="list"></div>
  <div id="planList" class="list hidden"></div>
  <div id="status" style="color: var(--muted); font-size: 13px; margin-top: 10px"></div>
</div>

<script>
"use strict";
let code = "";
try { code = localStorage.getItem("lumenCode") || ""; } catch (e) {}
// A link with ?code=123456 (e.g. from a QR code) logs straight in.
const linked = new URLSearchParams(location.search).get("code");
if (linked) {
  code = linked;
  try { localStorage.setItem("lumenCode", code); } catch (e) {}
}
let state = null;
const $ = id => document.getElementById(id);

async function call(path, body) {
  const options = { method: body === undefined ? "GET" : "POST", headers: { "X-Lumen-Code": code } };
  if (body !== undefined) {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  const response = await fetch("/api/" + path, options);
  const reply = await response.json();
  if (response.status === 401 || response.status === 429) {
    showLogin(reply.error === "wrong code" ? "That code is not right." : "Too many wrong codes: wait a minute.");
    throw new Error(reply.error);
  }
  if (reply.state) render(reply.state);
  return reply;
}

function showLogin(message) {
  $("remote").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("error").textContent = message || "";
}

function render(s) {
  state = s;
  $("login").classList.add("hidden");
  $("remote").classList.remove("hidden");
  $("plan").textContent = (s.planName || "Lumen").toUpperCase();
  $("live").textContent = s.liveText || (s.black ? "Black" : s.logo ? "Logo" : "—");
  $("liveLabel").textContent = s.liveSlide >= 0 ? "LIVE · " + s.liveLabel : "LIVE";
  $("next").textContent = s.previewText || "—";
  $("logo").classList.toggle("on", s.logo);
  $("black").classList.toggle("on", s.black);
  $("status").textContent = s.mode === "edit" ? "Lumen is in Edit mode: nothing goes live." : "";

  const slides = $("slides");
  slides.replaceChildren(...s.slides.map((slide, i) => {
    const b = document.createElement("button");
    b.className = "item" + (i === s.liveSlide ? " livenow" : i === s.previewSlide ? " current" : "");
    const label = document.createElement("small");
    label.textContent = slide.group + " · " + (i + 1);
    b.append(label, document.createTextNode(slide.text || "(no text)"));
    b.onclick = () => call("slide", { index: i }).catch(() => {});
    return b;
  }));

  const plan = $("planList");
  plan.replaceChildren(...s.plan.map((item, i) => {
    if (item.header) {
      const h = document.createElement("div");
      h.className = "header-item";
      h.textContent = item.title.toUpperCase();
      return h;
    }
    const b = document.createElement("button");
    b.className = "item" + (i === s.liveItem ? " livenow" : i === s.currentItem ? " current" : "");
    const kind = document.createElement("small");
    kind.textContent = item.kind;
    b.append(kind, document.createTextNode(item.title));
    b.onclick = () => call("item", { index: i }).then(() => showTab("slides")).catch(() => {});
    return b;
  }));
}

function showTab(which) {
  $("slides").classList.toggle("hidden", which !== "slides");
  $("planList").classList.toggle("hidden", which !== "plan");
  $("tabSlides").classList.toggle("on", which === "slides");
  $("tabPlan").classList.toggle("on", which === "plan");
}

document.querySelectorAll("button[data-cmd]").forEach(b => {
  b.onclick = () => {
    const args = b.dataset.layer ? { layer: b.dataset.layer } : {};
    call(b.dataset.cmd, args).catch(() => {});
  };
});
$("tabSlides").onclick = () => showTab("slides");
$("tabPlan").onclick = () => showTab("plan");
$("logout").onclick = () => { showLogin(""); $("code").value = ""; $("code").focus(); };
$("connect").onclick = () => {
  code = $("code").value.trim();
  try { localStorage.setItem("lumenCode", code); } catch (e) {}
  call("state").catch(() => {});
};
$("code").addEventListener("keydown", e => { if (e.key === "Enter") $("connect").click(); });

// Keep up with the operator (and other remotes).
setInterval(() => { if (code && !$("remote").classList.contains("hidden")) call("state").catch(() => {}); }, 700);
if (code) call("state").catch(() => showLogin("")); else showLogin("");
</script>
</body>
</html>
